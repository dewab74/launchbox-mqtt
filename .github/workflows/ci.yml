name: build and test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Core is platform-neutral; Windows is where the plugin actually runs.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CI: "true"
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      # Locked mode (CI=true in Directory.Build.props): a stale packages.lock.json fails here.
      - run: dotnet restore LaunchBoxMqtt.slnx

      - run: dotnet build LaunchBoxMqtt.slnx --no-restore -c Release -warnaserror

      - run: dotnet test --solution LaunchBoxMqtt.slnx --no-build -c Release

      # The real installer is built from a release zip (installer.yml); this
      # compiles the script against placeholder files so a broken .iss fails here.
      - name: Compile the installer script
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force fake/LaunchBoxMqtt | Out-Null
          Set-Content fake/LaunchBoxMqtt/LaunchBoxMqtt.Plugin.dll 'placeholder'
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress | Out-Null }
          & $iscc /Q "/DAppVersion=0.0.0-ci" "/DPluginDir=$PWD\fake\LaunchBoxMqtt" installer\LaunchBoxMqtt.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited $LASTEXITCODE" }
          if (-not (Test-Path artifacts/installer/LaunchBoxMqtt-Setup-0.0.0-ci.exe)) { throw 'no installer produced' }
