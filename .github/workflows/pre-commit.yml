# Backstop only. Linting and secret scanning run locally in the pre-commit
# hooks, before a commit exists. This job catches commits that skipped them
# (`--no-verify`, or a clone without `pre-commit install`) and runs the exact
# same .pre-commit-config.yaml, so it cannot drift from what developers see.

name: pre-commit backstop

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history so gitleaks can scan it

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      # The dotnet-format and dotnet-build hooks shell out to the SDK.
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: pre-commit/action@v3.0.1
